<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRally - Telemetry & Pace Note Acquisition</title>
  <style>
    /* --- ROOT & RESET --- */
    :root {
      --bg-color: #0b0c10;
      --card-bg: #12141a;
      --card-border: #1e222d;
      --accent-green: #00e676;
      --accent-green-glow: rgba(0, 230, 118, 0.25);
      --accent-blue: #29b6f6;
      --accent-red: #ff5252;
      --text-main: #ffffff;
      --text-muted: #90a4ae;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.5;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- HERO HEADER --- */
    .hero {
      text-align: center;
      margin-top: 12px;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero h1 span.highlight {
      color: var(--accent-green);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-weight: 400;
    }

    /* --- VIDEO DEMO CARD --- */
    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header Bar containing Title, Badges & Audio Button */
    .video-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
    }

    .live-badge {
      background: rgba(255, 82, 82, 0.15);
      color: var(--accent-red);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-red);
      border-radius: 50%;
      display: inline-block;
    }

    /* Audio Toggle Button in Header */
    .audio-btn {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--accent-green-glow);
      transition: transform 0.1s ease, background 0.2s ease;
      white-space: nowrap;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .video-wrapper video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    /* --- CTA BUTTON --- */
    .btn-explore {
      background-color: var(--accent-green);
      color: #000;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
      padding: 16px;
      border-radius: 30px;
      letter-spacing: 0.5px;
      display: block;
      box-shadow: 0 4px 16px var(--accent-green-glow);
    }

    /* --- DATA SECTION --- */
    .data-banner {
      background: #09131a;
      border: 1px solid rgba(41, 182, 246, 0.2);
      border-radius: 30px;
      padding: 16px;
      text-align: center;
    }

    .data-banner a {
      color: #4dd0e1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HERO HEADER -->
    <header class="hero">
      <h1>This isn't subjective.<br>This is <span class="highlight">telemetry.</span></h1>
      <p>Replace driver bias with exact GPS geometry, automated corner radii, hands-free speech confirmation, and instant co-driver longhand printouts.</p>
    </header>

    <!-- LIVE DEMO VIDEO CARD -->
    <main class="video-card">
      <div class="video-header">
        <div class="header-left">
          <span class="header-title">IN-ACTION DEMONSTRATION</span>
          <span class="live-badge"><span class="live-dot"></span> REAL-TIME RECCE</span>
        </div>
        <button class="audio-btn" id="audio-toggle-btn" type="button">ENABLE AUDIO 🔊</button>
      </div>
      <div class="video-wrapper">
        <video id="demo-video" autoplay loop muted playsinline controls preload="metadata">
          <source src="./demo.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </main>

    <!-- ACTION BUTTON -->
    <a href="#system" class="btn-explore">EXPLORE QRALLY SYSTEM</a>

    <!-- PACENOTE DATA BANNER -->
    <div class="data-banner">
      <a href="#acquisition">QRALLY • PACE NOTE DATA ACQUISITION</a>
    </div>

  </div>

  <script>
    // Audio Toggle Handler
    const video = document.getElementById('demo-video');
    const audioBtn = document.getElementById('audio-toggle-btn');

    audioBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        video.play();
        audioBtn.innerText = 'MUTE AUDIO 🔇';
        audioBtn.style.background = 'rgba(255, 82, 82, 0.9)';
        audioBtn.style.color = '#fff';
      } else {
        video.muted = true;
        audioBtn.innerText = 'ENABLE AUDIO 🔊';
        audioBtn.style.background = 'var(--accent-green)';
        audioBtn.style.color = '#000';
      }
    });
  </script>

</body>
</html>
